server {
    server_name www.clawmart.cn clawmart.cn;

    # 日志文件
    access_log /var/log/nginx/clawmart.cn.access.log;
    error_log /var/log/nginx/clawmart.cn.error.log;

    # 后端 API 代理到本地 8070 端口
    location /api {
        proxy_pass http://127.0.0.1:8070;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Filament Admin — 直接走 PHP-FPM，避免 artisan serve 单进程超时
    root /var/www/openclaw-marketplace/backend/public;

    location ~ ^/(admin|livewire|css/filament|js/filament) {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(admin|livewire|css/filament|js/filament).*\.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 120;
    }

    location = /index.php {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 120;
    }

    # 前端代理到本地 3112 端口
    location / {
        proxy_pass http://127.0.0.1:3112;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.clawmart.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.clawmart.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = clawmart.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = www.clawmart.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name www.clawmart.cn clawmart.cn;
    return 404; # managed by Certbot




}